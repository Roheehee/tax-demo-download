<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="tax-demo-shell" content="income">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=auto">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest?v=50">
  <link rel="apple-touch-icon" href="icons/v50/apple-touch-icon.png">
  <title>收入纳税明细</title>
  <link rel="stylesheet" href="income.css?v=53">
  <link rel="stylesheet" href="flows.css?v=53">
  <link rel="stylesheet" href="typography.css?v=54">
  <link rel="stylesheet" href="income-refinement.css?v=53">
  <!-- Keep the result-only layout in the document so its first paint needs no new stylesheet. -->
  <style>
/* Same normal document flow as the on-device text comparison. Only the OS owns
   the top safe area. There is no scrolling phone shell or animated header. */
*{box-sizing:border-box}
html{font-size:min(1px,calc(100vw / 402));background:#fff}
body{margin:0 auto;max-width:402px;background:#fff;color:#303030;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.document-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:47px;padding:0 16rem;border-bottom:1px solid #e2e2e2;background:#fff}
.document-bar h1{margin:0;color:#333;text-align:center;font-size:17px;line-height:24px;font-weight:400;white-space:nowrap}
.document-bar a,.document-bar button{display:flex;align-items:center;min-height:44px;padding:0;font-family:inherit;font-size:15px;line-height:24px;white-space:nowrap}
.document-back{justify-self:start;gap:4px;text-decoration:none;color:var(--income-accent)}
.document-back svg{width:10px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5}
#batch{justify-self:end;margin-right:14rem;color:var(--income-accent)}
.document-list.income-page{display:flow-root;position:static;visibility:visible;transform:none;transition:none;padding-bottom:25rem}
.income-record{color:inherit;text-decoration:none}
.income-empty{padding:28rem 16rem;text-align:center;font-size:15rem;color:#777}
dialog{box-sizing:border-box;width:min(92vw,370px);padding:20px;border:0;border-radius:14px;color:#333;font-size:15px;line-height:1.55}
dialog::backdrop{background:#0005}
dialog h2{margin:0;font-size:18px}
dialog form{display:flex;justify-content:flex-end}
dialog button{padding:6px 12px;color:var(--income-accent)}

/* The list remains the scrolling document underneath both pushed screens. */
.document-list .income-summary { position: static; }
.document-subview {
  position: fixed;
  inset: 47px 0 0;
  z-index: 2;
  width: min(100%, 402px);
  margin-inline: auto;
  display: flex;
  overflow: hidden;
  background: #f1f5f5;
}
#calculation { z-index: 3; }
.document-subview[hidden], .document-bar button[hidden] { display: none; }
.document-subview .flow-body {
  min-height: 0;
  overscroll-behavior-y: contain;
  padding-bottom: calc(34rem + env(safe-area-inset-bottom, 0px));
}
#calculation .flow-body { padding-bottom: calc(84rem + env(safe-area-inset-bottom, 0px)); }
html.income-subview-open { overflow: hidden; }
.income-subview-open body { padding-top: 47px; }
.income-subview-open .document-bar {
  position: fixed;
  inset: 0 0 auto;
  z-index: 4;
  padding-inline: max(16rem, calc((100% - 402px) / 2 + 16rem));
}
.income-subview-open #batch { margin-right: 0; }
.document-bar h1:focus { outline: none; }
  </style>
<link id="installed-headers" rel="stylesheet" href="installed-headers.css?v=51" media="(display-mode: standalone), (display-mode: fullscreen)">
<script>
  // A managed iOS Home Screen icon can report browser display mode.
  if (location.protocol !== 'file:' && navigator.standalone === true) {
    document.getElementById('installed-headers').media = 'all';
  }
</script>
</head>
<body class="income-document">
  <header class="document-bar">
    <a class="document-back" id="back" href="./" aria-label="返回上一页"><svg viewBox="0 0 10 19" aria-hidden="true"><path d="M9 1 1 9.5 9 18"/></svg>返回</a>
    <h1 tabindex="-1">收入纳税明细</h1>
    <button id="batch" type="button">批量申诉</button>
  </header>
  <main class="income-page document-list">
    <section class="income-summary" aria-label="收入汇总">
      <div class="total-line"><span>收入合计<button class="income-help" type="button" aria-label="收入合计说明"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="6.65" stroke="currentColor" stroke-width=".72"/><path d="M5 5.3C5 2.7 9.1 2.5 9.2 5.2C9.3 6.7 7.1 6.9 7.1 8.6V9.45" stroke="currentColor" stroke-width=".6" stroke-linecap="round"/><circle cx="7.1" cy="10.8" r=".4" fill="currentColor"/></svg></button><span class="income-colon">:</span></span><span id="total-income">—</span></div>
      <div class="total-line"><span>已申报税额合计:</span><span id="total-tax">—</span></div>
    </section>
    <div class="income-records"></div>
  </main>
  <main class="document-subview income-detail-flow" id="detail" aria-label="收入纳税明细详情" hidden><div class="flow-body"></div></main>
  <main class="document-subview tax-calculation-flow" id="calculation" aria-label="税款计算" hidden><div class="flow-body"></div></main>
  <dialog aria-labelledby="notice-title"><h2 id="notice-title"></h2><p id="notice-message"></p><form method="dialog"><button>关闭</button></form></dialog>
  <script src="income-navigation.js?v=47"></script>
  <script src="income-preset.js?v=25" defer></script>
  <script src="income-defaults.js?v=37" defer></script>
  <script src="income-model.js?v=42" defer></script>
  <script src="income-detail.js?v=42" defer></script>
  <script src="income-view.js?v=46" defer></script>
  <script src="pwa.js" defer></script>
</body></html>
