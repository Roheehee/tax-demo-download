<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#ffffff">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-title" content="显示测试">
 <title>显示测试</title>
 <link rel="manifest" href="manifest.webmanifest">
 <link rel="apple-touch-icon" href="icon-192.png">
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <div id="test-shell" data-layout="flow">
  <header id="test-header">
   <button type="button" id="help">说明</button>
   <h1 id="test-title">顶部显示测试</h1>
   <button type="button" id="switch">切换</button>
  </header>
  <main id="test-content">
   <p class="badge" id="launch-mode">正在检查打开方式…</p>
   <section id="instructions">
    <h2>新的文字对照</h2>
    <p><a href="document.html">打开普通网页对照</a>，直接比较上方和下方相同的文字，不用添加桌面图标。</p>
    <p>下方保留之前的两种显示方式。</p>
    <p id="install-hint">当前浏览器结果与桌面图标内的显示分开判断。</p>
    <p class="muted">此页不读取或修改个税数据。诊断信息只显示在本页，点击复制后由你自行发送。</p>
   </section>
   <section>
    <h2>分别看一下两种显示方式</h2>
    <div class="layout-options" role="group" aria-label="显示方式">
     <button type="button" data-layout-choice="flow" aria-pressed="true">方式一</button>
     <button type="button" data-layout-choice="fixed-header" aria-pressed="false">方式二</button>
    </div>
    <p id="current-layout">当前：方式一</p>
    <fieldset><legend>顶部标题</legend>
     <label><input type="radio" name="clarity" value="clear">清楚</label>
     <label><input type="radio" name="clarity" value="blurred">模糊</label>
    </fieldset>
    <fieldset><legend>底部结束标记</legend>
     <label><input type="radio" name="bottom" value="complete">完整</label>
     <label><input type="radio" name="bottom" value="incomplete">被截断或有明显大块空白</label>
    </fieldset>
    <button type="button" id="copy" class="primary">复制诊断结果</button>
    <p id="copy-status" role="status" aria-live="polite"></p>
    <details><summary>查看诊断信息</summary><textarea id="report" readonly aria-label="诊断结果" spellcheck="false"></textarea></details>
   </section>
   <p class="muted">结束标记下方的手机手势区属于正常留白。</p>
   <p class="muted">若不确定怎么描述，复制结果发回来即可。此页没有模拟时间、信号、电量或灵动岛。</p>
  </main>
  <footer id="end-marker">页面结束标记 <span>↓</span></footer>
 </div>
 <div id="measurement-probes" aria-hidden="true">
 <div id="safe-probe" aria-hidden="true"></div>
 <div id="vh-probe" aria-hidden="true"></div>
 <div id="dvh-probe" aria-hidden="true"></div>
 </div>
 <script src="check.js?v=2"></script>
</body>
</html>
